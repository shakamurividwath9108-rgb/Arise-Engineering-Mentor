<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">ARISE</title>
  <desc id="desc">Original silver-violet hunter wordmark with a rising blade and the words Rise, Achieve, Empower.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".28" stop-color="#c9c6d8"/>
      <stop offset=".5" stop-color="#fff"/>
      <stop offset=".72" stop-color="#968ab5"/>
      <stop offset="1" stop-color="#f8f4ff"/>
    </linearGradient>
    <linearGradient id="rift" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#61ddff" stop-opacity="0"/>
      <stop offset=".48" stop-color="#80e7ff"/>
      <stop offset=".72" stop-color="#c198ff"/>
      <stop offset="1" stop-color="#c198ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="wordGlow" x="-20%" y="-30%" width="140%" height="170%">
