  <text x="450" y="177" text-anchor="middle" fill="url(#silver)" stroke="#fff" stroke-opacity=".16" stroke-width="1.2" paint-order="stroke" font-family="Palatino Linotype, Book Antiqua, Georgia, serif" font-size="142" font-weight="600" font-style="italic" letter-spacing="8" filter="url(#wordGlow)">ARISE</text>
  <path d="M283 207h334" stroke="url(#rift)" stroke-width="1.2"/>
  <text x="450" y="238" text-anchor="middle" fill="#d2c7e7" font-family="Georgia,serif" font-size="15" font-weight="700" letter-spacing="5.5">RISE · ACHIEVE · EMPOWER</text>
